# 构建并打包 APK
#
# 触发方式:
#   - 推送代码到 main / master
#   - 推送 tag(格式 v*)
#   - Pull Request 到 main / master
#   - 手动触发(Workflow dispatch)
#
# 产物:
#   - debug APK(可直接安装)
#   - release APK(配置签名密钥后为正式签名版,否则为未签名版)
#
# 发布:
#   - main 推送或手动触发且 APK 构建成功后,自动创建 GitHub Release:
#     tag 取 app/build.gradle.kts 中的 versionName(如 0.1.5,无需手动打 tag),
#     Release 正文取 CHANGELOG.md 中对应版本章节。
#     versionName 带后缀(如 1.0.0-rc1)时发布为 Pre-release,且不会成为 /releases/latest。
#   - Pull Request 不会触发发布。
#
# 可选签名(Release):
#   在仓库 Settings → Secrets and variables → Actions 中配置以下密钥后,
#   release APK 将使用对应 keystore 签名:
#     KEYSTORE_BASE64   - keystore 文件的 Base64 编码内容
#     KEYSTORE_PASSWORD - keystore 密码
#     KEY_ALIAS         - 签名密钥别名
#     KEY_PASSWORD      - 签名密钥密码
#
# 生成 Base64:
#   base64 -w0 keystore.jks        (Linux / macOS)
#   certutil -encode keystore.jks  (Windows,再去除换行)

name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # 仓库已随源码提交 Gradle Wrapper;此步用官方发行版重新生成,
      # 确保 wrapper 脚本与 jar 均为官方产物。
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1 --no-daemon

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release keystore (optional)
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
            echo "keystore prepared for release signing"
          else
            echo "KEYSTORE_BASE64 not configured - release APK will be unsigned"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PfirebaseCrashlyticsMappingFileUploadEnabled=false
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 从 app/build.gradle.kts 读取 versionName 作为发布 tag(如 0.1.5)
      - name: Resolve app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION_NAME"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 从 CHANGELOG.md 提取该版本对应章节作为 Release 正文
      - name: Extract changelog for this version
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            index($0, "## " ver " ") == 1 || $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if [ ! -s release-body.md ]; then
            echo "::warning::CHANGELOG.md 中没有版本 $TAG 的条目,跳过发布"
            exit 0
          fi
          # 版本号带后缀(如 1.0.0-rc1)视为预发布:GitHub 上标成 Pre-release,
          # 同时它不会成为 /releases/latest —— 应用内「检查更新」仍指向最近一个正式版,
          # RC 只给主动安装的人用。正式版(无后缀)照常发布为 Latest。
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
            echo "Pre-release version detected: $TAG"
          fi
          # 幂等:同名 release/tag 已存在时先删除再重建(部分 gh 版本不支持 --clobber)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, deleting and recreating"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            artifacts/apk-debug/*.apk \
            artifacts/apk-release/*.apk \
            --title "$TAG" \
            --notes-file release-body.md \
            $PRERELEASE_FLAG
        env:
          GH_TOKEN: ${{ github.token }}
